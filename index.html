<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our trips · CT ♡ VB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/styles.css" />
  <style>
    .trips-hero { min-height: 62vh; display: grid; place-items: center; text-align: center; padding: 80px 24px 40px; }
    .monogram { font-family: var(--serif); font-size: clamp(3.4rem, 9vw, 6.5rem); color: var(--sea-deep); line-height: 1; font-style: italic; font-weight: 400; }
    .monogram .heart { color: var(--rose); font-style: normal; margin: 0 .15em; }
    .trips-hero p { color: var(--muted); max-width: 520px; margin: 18px auto 0; font-size: 1.05rem; }
    .trips { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; padding-bottom: 80px; }
    .trip { position: relative; border-radius: var(--radius); overflow: hidden; height: 340px; box-shadow: var(--shadow); text-decoration: none; color: #fff; display: block; transition: transform .25s, box-shadow .25s; }
    .trip:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .trip img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
    .trip:hover img { transform: scale(1.04); }
    .trip .t { position: absolute; inset: auto 0 0 0; padding: 60px 22px 22px; background: linear-gradient(0deg, rgba(20,62,82,.88), transparent); }
    .trip .t small { display: block; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; opacity: .9; }
    .trip .t b { font-family: var(--serif); font-size: 2.2rem; font-weight: 400; font-style: italic; display: block; margin: 4px 0 2px; }
    .trip .t span { font-size: .9rem; opacity: .92; }
    .trip .status { position: absolute; top: 14px; left: 14px; background: rgba(255,253,249,.92); color: var(--rose); font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }
    .trip.next { border: 2px dashed rgba(31,95,122,.3); background: var(--paper); display: grid; place-items: center; color: var(--muted); box-shadow: none; }
    .trip.next .plus { font-family: var(--serif); font-size: 3rem; color: var(--sea); }
    .trip.next:hover { transform: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-heart">♡</span> Our trips <span class="brand-dates">CT · VB</span></a>
  </header>
  <section class="trips-hero">
    <div>
      <p class="eyebrow">Places we're going, together</p>
      <h1 class="monogram">CT<span class="heart">♡</span>VB</h1>
      <p>Every trip gets its own little site: the route, where we sleep, where we eat, what we pack. Pick one.</p>
    </div>
  </section>
  <main class="wrap">
    <div id="trips" class="trips"></div>
  </main>
  <script src="trips.js"></script>
  <script>
    document.getElementById("trips").innerHTML = window.TRIPS.map((t) => `
      <a class="trip" href="${t.slug}/index.html">
        <img src="${t.cover}" alt="" />
        <span class="status">${t.status}</span>
        <div class="t"><small>${t.dates}</small><b>${t.title}</b><span>${t.tagline}</span></div>
      </a>`).join("") + `<div class="trip next"><div><div class="plus">+</div>the next one</div></div>`;
  </script>
</body>
</html>
